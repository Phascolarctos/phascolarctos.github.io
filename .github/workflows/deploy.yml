name: deploy

on:
  push:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
  
   steps:
      - uses: actions/checkout@v4

      # 1. 环境准备：Rust & Wasm-pack
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 2. 执行构建逻辑
      - name: Rust Build (Generate Index)
        run: cargo run --bin gen

      - name: Wasm Build
        # 确保路径指向你包含 Cargo.toml 的目录，如果是根目录则直接运行
        run: wasm-pack build --target web

      # 3. Node.js 环境准备
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 💡 提示：Node 25 目前可能过于前卫，建议使用 LTS 版本 (如 20 或 22) 确保稳定性
          node-version: '22' 
          # 如果你用 pnpm，建议开启缓存提升速度
          # cache: 'pnpm' 

      # 4. 前端打包
      - name: Install & Build Frontend
        run: |
          npm install
          npm run build  # 👈 必须执行 build 才能生成 dist 文件夹
